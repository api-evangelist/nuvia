description: Nuvia was a semiconductor startup founded in 2019 to design high-performance,
  energy-efficient Arm-based CPU cores for data-center and client computing, backed by Mayfield
  among other investors. Qualcomm acquired Nuvia in 2021 and its core technology became the
  Qualcomm Oryon CPU. Nuvia has no independent developer, API, or product surface today; its
  former site nuviainc.com now redirects to qualcomm.com. Retained in the API Evangelist network
  as a VC-portfolio identity record rather than an active API provider.
